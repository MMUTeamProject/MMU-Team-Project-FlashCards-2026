<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Flash Cards</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-container">
        <h1>Create New Flash Card</h1>




        <form id="flashCardForm">
            <label for="Stack Name">Stack Name</label>
            <br>
                <select name="Stack Name" id="Stack Name">
                    <option value="Maths">Maths</option>
                    <option value="English">English</option>
                    <option value="Coding">Coding</option>
                    <option value="Database">Database</option>
                    <option value="Programming">Programming</option>
                    <option value="Web Development">Web Development</option>
                    <option value="Computer Architecture">Computer Archicture</option>
                </select>
            <br>    
            <br>  
            <br>  
            <label for="question">Question</label>

            <textarea id="question" placeholder="Enter the question here..." rows="4" required></textarea>

            <label for="answer">Answer</label>

            <textarea id="answer" placeholder="Enter the answer here..." rows="4" required></textarea>

            <div class="button-container">
                <button type="button" class="btn btn-prevous" , onclick="prevCardButton()">← Previous Card</button>
                <span class="card-counter" , id="counter">Card 1</span>
                <button type="button" class="btn btn-next" , onclick="nextCardButton()">Next Card →</button>
            </div>

            <hr>

            <div class="button-container">
                <button type="submit" href="Home_Page.html" class="btn btn-complete">Complete</button>
                <a href="Home_Page.html" class="btn btn-home">Home</a>
                <a href="Home_Page.html" class="btn btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
    <script src="addStack.js"></script>
</body>

</html>
