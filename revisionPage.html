<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Revision Cards</title>
</head>
<body class="revision-body">
    <button class="dark-mode-toggle" id="darkModeBtn" title="Toggle Dark Mode">
        <span class="theme-icon">🌙</span>
    </button>
    
    <h1 id="stack-title">Subject</h1>
    <h3 id="counter">Card 1</h3>

    <div class="flip-card" id="card-container">
        <div class="flip-card-inner" id="card-inner">
            <div class="flip-card-front">
                <h1>Question</h1> 
                <p id="display-question">The question will appear here...</p> 
            </div>
            <div class="flip-card-back">
                <h1>Answer</h1> 
                <p id="display-answer">The answer will appear here...</p> 
            </div>
        </div>
    </div>

    <div class="button-container">
        <button id="prev-btn" class="btn">Previous</button>
        <button id="next-btn" class="btn">Next</button>
        <a href="index.html" class="btn btn-complete">Home</a>
    </div>

    <script src="script.js"></script>
    <script src="revisionPage.js"></script>
</body>
</html>
