<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Revision Stacks</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="view-container">
        <h1>Current Revision Stacks</h1>

        <table id="stackTable" class="styled-table">
            <tr>
                <th>Stack Name</th>
                <th>Number of Cards</th>
                <th>View</th>
            </tr>
        </table>

        <div class="button-container" style="margin-top: 20px;">
            <button class="btn btn-view" onclick="loadStacks()">Load Stacks</button>
        </div>

        <!-- Viewer Box (now includes Edit + Save buttons) -->
        <div id="viewer" class="viewer-box">
            <h2>Stack Contents</h2>
            <textarea id="viewerText" rows="15" readonly></textarea>

            <div class="button-container" style="margin-top: 15px;">
                <button id="editBtn" class="btn btn-view" style="display:none;" onclick="enableEditing()">Edit Stack</button>
                <button id="saveBtn" class="btn btn-create" style="display:none;" onclick="saveEditedStack()">Save Changes</button>
            </div>
        </div>

        <div class="button-container" style="margin-top: 25px;">
            <a href="index.html" class="btn btn-home">Home</a>
        </div>
    </div>

    <script src="viewStacks.js"></script>
</body>

</html>
