<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Current Revision Stacks</h1>

<table id="stackTable">
  <tr>
    <th>Stack name</th>
    <th>Number of Cards</th>
  </tr>
</table>

<br>

<button onclick="loadStacks()">Load Stacks</button>

<br><br>

<div class="button-container">
  <a href="Home_Page.html" class="btn btn-complete">Home</a>
</div>

<script>
// Load and parse stacks.txt
async function loadStacks() {
  try {
    const response = await fetch("stacks.txt"); //double check file name with Karo
    const text = await response.text();

    const stacks = parseStacks(text);
    displayStacks(stacks);

  } catch (error) {
    console.error("Error loading stacks:", error);
  }
}

// Convert text file into stack objects
function parseStacks(text) {
  const lines = text.split("\n");

  const stacks = [];
  let currentStack = null;

  lines.forEach(line => {
    line = line.trim();

    if (line.startsWith("stack:")) {
      // Start a new stack
      if (currentStack) stacks.push(currentStack);

      currentStack = {
        name: line.replace("stack:", "").trim(),
        cards: []
      };
    }

    if (line.startsWith("question:")) {
      const question = line.replace("question:", "").trim();
      currentStack.cards.push({ question, answer: "" });
    }

    if (line.startsWith("answer:")) {
      const answer = line.replace("answer:", "").trim();
      if (currentStack.cards.length > 0) {
        currentStack.cards[currentStack.cards.length - 1].answer = answer;
      }
    }
  });

  // Push last stack if exists
  if (currentStack) stacks.push(currentStack);

  return stacks;
}

// Display stacks in the table
function displayStacks(stacks) {
  const table = document.getElementById("stackTable");

  table.innerHTML = `
    <tr>
      <th>Stack name</th>
      <th>Number of Cards</th>
    </tr>
  `;

  stacks.forEach(stack => {
    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${stack.name}</td>
      <td>${stack.cards.length}</td>
    `;

    // Make row clickable
    row.style.cursor = "pointer";
    row.onclick = () => {
      localStorage.setItem("selectedStack", stack.name);
      window.location.href = "revisionpage.html";
    };

    table.appendChild(row);
  });
}

</script>

</body>
</html>
