<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="stylesheet" href="cards.css">
  <title>Card exercise</title>
</head>

<body>
  <div id="card">
    <p>Question</p>
  </div>

  <a href="https://kahoot.com/">
    <button type="button" id="stack">Stack</button>
  </a>

  <button type="button" id="next">Next</button>

  <script>
    // Get the box element
    const box = document.getElementById('card');
    const nextBtn = document.getElementById('next');

    // Toggle rotation on click
    box.addEventListener('click', () => {
      box.textContent = "";
      box.classList.toggle('rotated');
      box.textContent = "Answer";
    });


    nextBtn.addEventListener('click', () => {
      box.textContent = "";
      box.classList.toggle('rotated');
      box.textContent = "Next Question";       
    });
  </script>
</body>


</html>
